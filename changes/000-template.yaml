change:
  id: change.<name>
  intent: 描述本次改动要达成的结果（一句话）
  authorization: modify          # modify | compose | extend | rearchitect（取所需最高一项）
  targets:
    - crates/composition-domain
  operations:
    - modify
  scope:
    allowed:
      - crate_internal_implementation
      - crate_unit_tests
    forbidden:
      - toml_schema
      - command_protocol
      - design_baseline
  impact:
    expected_schema_changes: false
    expected_command_changes: false
    expected_design_baseline_changes: false
  validation:
    - cargo test -p composition-domain
  notes: 普通实现任务默认只允许改目标 crate 内部实现与测试；超出范围必须升级 authorization 并获得授权。
