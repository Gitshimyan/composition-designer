change:
  id: change.m2-revision-diff
  intent: 在 editor 中加入 Revision 历史、request_id 幂等、base revision 冲突与结构化 Diff
  authorization: modify
  targets:
    - crates/composition-editor
    - docs/spec
    - docs/ai
    - working
  operations:
    - modify
  scope:
    allowed:
      - revision_history
      - request_idempotency
      - structured_diff
      - documentation
      - task_card
    forbidden:
      - toml_editing
      - toml_schema
      - design_baseline
  impact:
    expected_schema_changes: false
    expected_command_changes: true
    expected_design_baseline_changes: false
  validation:
    - cargo test --workspace
    - cargo clippy --workspace --all-targets -- -D warnings
    - cargo fmt --all --check
  notes: 010 仍在内存中；TOML 写回与 source_digest 刷新由 011 完成。
