change:
  id: change.m1-composition-cli
  intent: 新增 composition-cli，提供 inspect/resolve/validate、稳定 JSON、退出码与 golden 测试
  authorization: extend
  targets:
    - Cargo.toml
    - Cargo.lock
    - crates/composition-cli
    - crates/composition-domain
    - docs/ai
    - working
  operations:
    - extend
    - modify
  scope:
    allowed:
      - new_crate
      - dependency
      - serialization
      - documentation
      - task_card
    forbidden:
      - toml_schema
      - design_baseline
      - toml_editing
  impact:
    expected_schema_changes: false
    expected_command_changes: true
    expected_design_baseline_changes: false
  validation:
    - cargo test --workspace
    - cargo clippy --workspace --all-targets -- -D warnings
    - cargo fmt --all --check
  notes: CLI 只读调用 composition-core；JSON 形状与退出码由本卡冻结，不写项目文件。
