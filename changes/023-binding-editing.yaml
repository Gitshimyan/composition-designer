change:
  id: change.023-binding-editing
  intent: 在 Designer 中实现 Slot 感知的 Binding 移动/Detach 与必填 Slot 子树创建，复用统一事务和 Core 校验。
  authorization: modify
  targets:
    - apps/designer/src
    - apps/designer/tests
    - apps/designer/src-tauri/src
    - apps/designer/README.md
    - docs/ai/architecture-entry.md
    - working
    - AGENTS.md
    - changes
  operations:
    - modify
  scope:
    allowed:
      - designer_react_ui
      - designer_tauri_host_tests
      - playwright_ui_tests
      - task_card_and_plan
    forbidden:
      - toml_schema
      - command_protocol
      - design_baseline
      - composition_semantics
      - module_definitions
      - cargo_workspace_config
  impact:
    expected_schema_changes: false
    expected_command_changes: false
    expected_design_baseline_changes: false
  validation:
    - cd apps/designer && npm run build
    - cd apps/designer && npm run test:ui
    - cargo test --manifest-path apps/designer/src-tauri/Cargo.toml
    - cargo test --workspace
    - cargo clippy --workspace --all-targets -- -D warnings
    - cargo fmt --all --check
  notes: 复用 009 冻结的 create_binding / update_binding / delete_binding 命令，不新增命令、字段或错误码。
