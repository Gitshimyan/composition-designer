[package]
name = "composition-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Composition Designer v0.1 command line interface"
publish = false

[[bin]]
name = "composition-cli"
path = "src/main.rs"

[dependencies]
composition-core = { path = "../composition-core" }
composition-domain = { path = "../composition-domain" }
composition-protocol = { path = "../composition-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
