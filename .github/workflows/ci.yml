name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and UI tests
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/designer/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Change gate (block)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: cargo run -p composition-change-gate -- --base "$env:BASE_SHA" --head "${{ github.sha }}" --mode block

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Tauri host tests
        run: cargo test --manifest-path apps/designer/src-tauri/Cargo.toml

      - name: MCP end-to-end
        run: cargo test -p composition-mcp --test e2e

      - name: Frontend dependencies
        working-directory: apps/designer
        run: npm ci

      - name: TypeScript, Vite and Playwright
        working-directory: apps/designer
        run: npm run test:ui

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/designer/playwright-report
            apps/designer/test-results
          if-no-files-found: ignore
