[composition]
schema_version = 1
id = "example.nested"
root = "app"

[[instances]]
id = "app"
module = "shell.desktop"
version = "1.0.0"

[instances.config]
title = "Nested"

[[instances]]
id = "page-1"
module = "ui.page"
version = "1.0.0"

[instances.config]
title = "Page 1"

[[instances]]
id = "page-2"
module = "ui.page"
version = "1.0.0"

[instances.config]
title = "Page 2"

[[instances]]
id = "panel-1"
module = "ui.panel"
version = "1.0.0"

[instances.config]
heading = "Left"

[[instances]]
id = "panel-2"
module = "ui.panel"
version = "1.0.0"

[instances.config]
heading = "Right"

[[instances]]
id = "hello"
module = "leaf.widget"
version = "1.0.0"

[instances.config]
label = "Hello"

[[instances]]
id = "world"
module = "leaf.widget"
version = "1.0.0"

[instances.config]
label = "World"

[[instances]]
id = "status"
module = "leaf.widget"
version = "1.0.0"

[instances.config]
label = "Status"

