[[bindings]]
id = "app-pages-2"
parent = "app"
slot = "content"
child = "page-2"

[[bindings]]
id = "page-1-main"
parent = "page-1"
slot = "main"
child = "panel-1"

[[bindings]]
id = "page-2-main"
parent = "page-2"
slot = "main"
child = "panel-2"

[[bindings]]
id = "panel-1-hello"
parent = "panel-1"
slot = "body"
child = "hello"

[[bindings]]
id = "panel-1-world"
parent = "panel-1"
slot = "body"
child = "world"

[[bindings]]
id = "panel-2-status"
parent = "panel-2"
slot = "body"
child = "status"
