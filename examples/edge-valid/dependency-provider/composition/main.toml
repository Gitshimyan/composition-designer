[composition]
schema_version = 1
id = "example.dependency"
root = "app"

[[instances]]
id = "app"
module = "shell.desktop"
version = "1.0.0"

[instances.dependencies]
logger = "logger-1"

[[instances]]
id = "engine"
module = "task.engine"
version = "1.0.0"

[[instances]]
id = "logger-1"
module = "logging.console"
version = "1.0.0"

[[bindings]]
id = "app-content-engine"
parent = "app"
slot = "content"
child = "engine"

[[bindings]]
id = "app-content-logger"
parent = "app"
slot = "content"
child = "logger-1"
