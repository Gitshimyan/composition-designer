[package]
name = "composition-designer"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Composition Designer desktop host"
publish = false

[lib]
name = "composition_designer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
composition-core = { path = "../../../crates/composition-core" }
composition-domain = { path = "../../../crates/composition-domain" }
composition-editor = { path = "../../../crates/composition-editor" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
toml_edit = "0.22.27"

[features]
custom-protocol = ["tauri/custom-protocol"]
